name: Publish NPM Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    # @v12 >= v12.3.0 (Zondax/_workflows#136): pinned npm 11 for OIDC trusted publishing.
    uses: zondax/_workflows/.github/workflows/_publish-npm.yaml@v12
    permissions:
      contents: read
      id-token: write
    with:
      timeout_minutes: 15
      # Dry-run on pushes and PRs so a publish-breaking change fails before a release.
      dry_run: ${{ github.event_name != 'release' }}
      github_app_auth: false
